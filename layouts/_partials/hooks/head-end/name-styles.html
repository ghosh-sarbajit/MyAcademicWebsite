{{- /* Small style fixes for the multi-script name (Bengali above, Tamil below) and the long navbar title. */ -}}
<style>
  /* Keep the Bengali annotation together and centred, and don't letter-space Indic scripts
     (extra spacing breaks up conjuncts). */
  .hb-ruby-name rt { ruby-align: center; letter-spacing: 0; }
  .hb-name-below { letter-spacing: 0; }
  /* Pronouns sit next to the name: keep "(he/him)" whole, and on wide screens make the name a little
     smaller (3rem -> 2.6rem) so name and pronouns fit on one line in the left column. */
  .hb-pronouns { white-space: nowrap; letter-spacing: 0; }
  @media (min-width: 1024px) {
    .resume-biography h1 { font-size: 2.6rem; }
  }
  /* The one-line headline ("PhD Scholar, CSE Department, IIT Kanpur"): never break inside a part. */
  .hb-headline a { white-space: nowrap; }
  @media (max-width: 640px) { .hb-headline { font-size: 1rem; } }
  /* The navbar title holds three scripts plus IPA: shrink it on phones so it fits on one line. */
  @media (max-width: 640px) {
    .navbar-brand { font-size: 0.8rem; white-space: nowrap; }
  }
</style>
